services:
  intercom-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intercom_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    volumes:
      # если data должна сохраняться между перезапусками
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - intercom-network

networks:
  intercom-network:
    driver: bridge